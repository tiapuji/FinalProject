plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.7.2'

    implementation group: 'io.cucumber', name: 'cucumber-java', version: '7.12.0'
    testImplementation group: 'io.cucumber', name: 'cucumber-junit', version: '7.12.0'

    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.39.0'
    implementation("io.github.bonigarcia:webdrivermanager:6.1.0")

    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.3.0'
    testImplementation group: 'org.json', name: 'json', version: '20220924'
    testImplementation 'io.rest-assured:json-path:5.3.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.3.0'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

test {
    useJUnitPlatform()
    systemProperty "cucumber.filter.tags", System.getProperty("cucumber.filter.tags")
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

tasks.register('apiTest') { Task ->
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            main = "io.cucumber.core.cli.Main"
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                    "--plugin", "pretty",
                    "--plugin", "html:reports/cucumber-api-report.html",
                    "--plugin", "json:reports/cucumber-api-report.json",
                    "--glue", "stepDef",
                    "--tags", "@api",
                    "src/test/java/features"
            ]
        }
    }

    tasks.register('webTest') {
        dependsOn assemble, testClasses
        doLast {
            javaexec {
                main = "io.cucumber.core.cli.Main"
                classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
                args = [
                        "--plugin", "pretty",
                        "--plugin", "html:reports/web-cucumber-report.html",
                        "--plugin", "json:reports/web-cucumber-report.json",
                        "--glue", "stepDef",
                        "--tags", "@web",
                        "src/test/java/features"
                ]
            }
        }
    }

    tasks.register('allTest') {
        dependsOn assemble, testClasses
        doLast {
            javaexec {
                main = "io.cucumber.core.cli.Main"
                classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
                args = [
                        "--plugin", "pretty",
                        "--plugin", "html:reports/cucumber-report.html",
                        "--plugin", "json:reports/cucumber-report.json",
                        "--glue", "stepDef",
                        "--tags", "@api or @web",
                        "src/test/java/features"
                ]
            }
        }
    }
}
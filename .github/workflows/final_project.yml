name: Run JUnit CI

#triger/kapan action jalan
on:
  push:
    branches: [ "master" ] #sesuaikan nama branch
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  automation:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin # Alternatif: 'adoptopenjdk', 'zulu'
          java-version: '11' # Ganti dengan versi Java lain seperti '8', '17'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
         chrome-version: latest  # Ganti dengan 'stable' untuk versi stabil
        # chrome-options: '--headless' (Jika ingin menjalankan Chrome dalam mode headless)

      - name: Build with Gradle
        run: gradlew.bat build # Make gradlew executable
             ./gradlew build   # Run the build task before tests

      - name: Run All Runner
        run: .\gradlew clean test --tests runner.AllRunner # Run tests after the build step

      - name: Run API Runner
        run: .\gradlew clean test --tests runner.ApiRunner

      - name: Run Web Runner
        run: .\gradlew clean test --tests runner.WebRunner

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always() # success(), failure(), canceled()
        with:
          name: cucumber-reports
          path: reports/